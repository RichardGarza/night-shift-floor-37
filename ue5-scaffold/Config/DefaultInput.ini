; Night Shift — Floor 37
; Prefer Enhanced Input assets (see INPUT_MAPPING.md). This file is a reference
; for projects that still keep legacy axis bindings alongside IMC.
; After drop-in: enable Enhanced Input plugin; set DefaultPlayerInputClass /
; DefaultInputComponentClass to Enhanced variants in DefaultInput.ini of the host project.

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bEnableMouseSmoothing=False
FOVScale=0.011110

; Legacy fallbacks (optional — Enhanced Input is authoritative)
+AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.0,Sensitivity=0.07,Exponent=1.f,bInvert=False))
+AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.0,Sensitivity=0.07,Exponent=1.f,bInvert=False))

; Mapping cheat-sheet (not applied as ActionMappings when using EI):
; WASD Move | Mouse Look | LMB Fire | R Reload | Shift Sprint | Space Jump | Q Shoulder | Esc Pause
